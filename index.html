<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piktorio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0e0e0e; --green:#3a7a25; --greenlt:#b8e888; --muted:#666; }
  html, body { background:var(--bg); color:#d8d4c0; font-family:'Courier New',monospace; height:100%; overflow:hidden; touch-action:none; }
  #app { display:flex; flex-direction:column; align-items:center; height:100dvh; gap:4px; padding:6px 4px 4px; }
  #topbar { display:flex; align-items:center; justify-content:space-between; width:100%; max-width:560px; flex-shrink:0; gap:8px; }
  #title { font-size:clamp(0.8rem,2.8vw,1.1rem); letter-spacing:0.2em; color:var(--greenlt); text-transform:uppercase; }
  #statusbar { display:flex; gap:10px; font-size:clamp(0.6rem,2vw,0.75rem); }
  .stat { display:flex; gap:3px; }
  .stat-label { color:var(--muted); }
  .stat-val { font-weight:bold; min-width:2ch; }
  #piktorioMessage { font-size:clamp(0.56rem,1.8vw,0.7rem); color:#aad888; min-height:1.1em; text-align:center; flex-shrink:0; padding:0 6px; }
  #canvasWrap { flex:1 1 0; display:flex; align-items:center; justify-content:center; min-height:0; width:100%; }
  #piktorioCanvas { border:1px solid #1a2a10; cursor:pointer; image-rendering:pixelated; touch-action:none; }
  #legend { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:clamp(0.5rem,1.5vw,0.62rem); color:#555; justify-content:center; flex-shrink:0; padding:0 4px 2px; }
  .leg { display:flex; align-items:center; gap:3px; }
  .leg-box { width:8px; height:8px; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title">Piktorio</div>
    <div id="statusbar">
      <div class="stat"><span class="stat-label">T</span><span class="stat-val" id="piktorioTurn">1</span></div>
      <div class="stat"><span class="stat-label">Phase</span><span class="stat-val" id="piktorioPhase">—</span></div>
      <div class="stat"><span class="stat-label">Move</span><span class="stat-val" id="piktorioMoves">3</span></div>
    </div>
  </div>
  <div id="piktorioMessage">読み込み中…</div>
  <div id="canvasWrap">
    <canvas id="piktorioCanvas"></canvas>
  </div>
  <div id="legend">
    <div class="leg"><div class="leg-box" style="background:#2d5a1b"></div>通路</div>
    <div class="leg"><div class="leg-box" style="background:#5a3010"></div>壁</div>
    <div class="leg"><div class="leg-box" style="background:#6b1a1a"></div>赤専用</div>
    <div class="leg"><div class="leg-box" style="background:#1a4a6b"></div>青専用</div>
    <div class="leg"><div class="leg-box" style="background:#5a5a10"></div>黄専用</div>
    <div class="leg"><span style="color:#ff6666">■</span>左上=赤置</div>
    <div class="leg"><span style="color:#ffee44">■</span>右上=黄置</div>
    <div class="leg"><span style="color:#55aaff">■</span>左下=青置</div>
    <div class="leg">右下=全拾 / ●=ターン終了</div>
  </div>
</div>
<script src="piktorioengine.js"></script>
<script>
const W  = { type: 'walk' };
const WL = (r,b,y) => ({ type:'walk', piks:{red:r||0,blue:b||0,yellow:y||0} });
const BK = { type: 'wall' };
const R  = { type: 'red'    };
const B  = { type: 'blue'   };
const Y  = { type: 'yellow' };

const mapData = {
  playerStart: [10, 10],
  tiles: [
    [ BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK ],
    [ BK,  W,  W,  W, BK,  W,  W,  W,  W,  W,  W,  W,  W,  W, BK,  W,  W,  W,  W, BK ],
    [ BK,  W, BK,  W, BK,  W, BK, BK, BK,  W, BK,  W, BK, BK, BK,  W, BK, BK,  W, BK ],
    [ BK,  W, BK,  W,  W,  W, BK, WL(3,0,0), BK, W, BK, W,  W,  W,  W,  W, BK,  W,  W, BK ],
    [ BK,  W, BK, BK, BK,  R,  R,  R, BK,  W, BK, BK, BK,  W, BK,  W, BK, BK,  W, BK ],
    [ BK,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W, BK ],
    [ BK, BK, BK,  W, BK, BK, BK, BK, BK,  W, BK,  B,  B, BK, BK, BK, BK, BK, BK, BK ],
    [ BK,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W, BK ],
    [ BK,  W, BK, BK,  W, BK, BK,  Y,  Y,  W, BK, BK, BK,  W, BK, BK, BK, BK,  W, BK ],
    [ BK,  W,  W, BK,  W, BK,  W,  W,  W,  W,  W,  W,  W,  W,  W, BK,  W,  W,  W, BK ],
    [ BK,  W, BK, BK,  W,  W,  W,  W, WL(0,2,0), W, W, W, BK, BK,  W,  W,  W, BK, W, BK ],
    [ BK,  W,  W,  W,  W, BK, BK,  W,  W,  W, BK,  W,  W,  W,  W, BK,  W,  W,  W, BK ],
    [ BK, BK, BK,  W, BK, BK,  W,  W,  W, BK,  W,  W, BK, BK,  W,  W, BK, BK,  W, BK ],
    [ BK,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W, BK ],
    [ BK,  W, BK, BK, BK,  R,  R, BK,  W, BK,  Y,  Y, BK,  W, BK, BK, BK, BK,  W, BK ],
    [ BK,  W,  W,  W,  W,  W, BK,  W,  W,  W,  W,  W, BK,  W,  W,  W,  W,  W,  W, BK ],
    [ BK, BK,  W, BK, BK, BK, BK,  W, BK, BK, BK,  W, BK, BK, BK,  W, BK, BK, BK, BK ],
    [ BK,  W,  W,  W,  W, WL(0,0,2), W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W,  W, BK ],
    [ BK,  W, BK,  W, BK,  W, BK,  B,  B,  W, BK,  W, BK,  W, BK,  W, BK,  W, BK, BK ],
    [ BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK ],
  ],
};

function resizeCanvas() {
  const canvas=document.getElementById('piktorioCanvas');
  const wrap=document.getElementById('canvasWrap');
  const size=Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight)/20)*20;
  if(size<=0)return;
  canvas.width=size;canvas.height=size;
  if(window._piktorioReady)Piktorioengine.init(mapData);
}

function bindCanvas() {
  const canvas=document.getElementById('piktorioCanvas');
  let ts=null;
  canvas.addEventListener('touchstart',e=>{e.preventDefault();ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:false});
  canvas.addEventListener('touchend',e=>{
    e.preventDefault();if(!ts)return;
    const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;
    const dist=Math.abs(dx)+Math.abs(dy);ts=null;
    if(dist<16){Piktorioengine.handleCanvasClick(e.changedTouches[0]);}
    else{
      if(Math.abs(dx)>Math.abs(dy))Piktorioengine.movePlayer(0,dx>0?1:-1);
      else Piktorioengine.movePlayer(dy>0?1:-1,0);
    }
  },{passive:false});
  canvas.addEventListener('click',e=>Piktorioengine.handleCanvasClick(e));
}

window.addEventListener('DOMContentLoaded',()=>{resizeCanvas();bindCanvas();window._piktorioReady=true;Piktorioengine.init(mapData);});
let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(resizeCanvas,150);});
</script>
</body>
</html>
