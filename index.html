<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piktorio</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0e0e0e;--green:#3a7a25;--greenlt:#b8e888;--muted:#666}
  html,body{background:var(--bg);color:#d8d4c0;font-family:'Courier New',monospace;height:100%;overflow:hidden;touch-action:none}
  #app{display:flex;flex-direction:column;align-items:center;height:100dvh;gap:4px;padding:6px 4px 4px}
  #topbar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:560px;flex-shrink:0;gap:8px}
  #title{font-size:clamp(0.8rem,2.8vw,1.1rem);letter-spacing:0.2em;color:var(--greenlt);text-transform:uppercase}
  #statusbar{display:flex;gap:10px;font-size:clamp(0.6rem,2vw,0.75rem)}
  .stat{display:flex;gap:3px}.stat-label{color:var(--muted)}.stat-val{font-weight:bold;min-width:2ch}
  #piktorioMessage{font-size:clamp(0.56rem,1.8vw,0.7rem);color:#aad888;min-height:1.1em;text-align:center;flex-shrink:0;padding:0 6px}
  #canvasWrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
  #piktorioCanvas{border:1px solid #1a2a10;cursor:pointer;image-rendering:pixelated;touch-action:none}
  #legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:clamp(0.5rem,1.5vw,0.62rem);color:#555;justify-content:center;flex-shrink:0;padding:0 4px 2px}
  .leg{display:flex;align-items:center;gap:3px}.leg-box{width:8px;height:8px;flex-shrink:0}
  #debugLog{width:100%;max-width:560px;height:80px;background:#111;color:#8f8;font-size:0.6rem;font-family:monospace;border:1px solid #333;resize:none;flex-shrink:0;padding:2px 4px;box-sizing:border-box;}
  /* ===== エディタUI ===== */
  #modeBar{display:flex;gap:6px;padding:3px 6px;background:#1a1a1a;flex-shrink:0;}
  .mode-btn{padding:4px 12px;border:1px solid #555;background:#222;color:#ccc;border-radius:4px;font-size:0.75rem;cursor:pointer;touch-action:manipulation;}
  .mode-btn.active{background:#3a6a3a;color:#fff;border-color:#6aaa6a;}
  #editorPanel{display:none;flex-direction:column;flex-shrink:0;background:#111;border-top:1px solid #333;}
  #edToolBar{display:flex;gap:4px;padding:4px 6px;flex-wrap:wrap;}
  .ed-tool-btn{padding:3px 10px;border:1px solid #444;background:#222;color:#bbb;border-radius:3px;font-size:0.72rem;cursor:pointer;touch-action:manipulation;}
  .ed-tool-btn.active{background:#335;color:#aaf;border-color:#66f;}
  #edPalette{display:flex;flex-wrap:wrap;gap:3px;padding:3px 6px;}
  .ed-palette-btn{width:36px;height:36px;border:2px solid #444;border-radius:3px;cursor:pointer;font-size:0.55rem;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;touch-action:manipulation;flex-shrink:0;}
  .ed-palette-btn.active{border-color:#ff0;outline:2px solid #ff0;}
  #edFoodOpts,#edTreasureOpts{display:none;padding:2px 6px;gap:4px;flex-wrap:wrap;align-items:center;}
  #edFoodOpts.show,#edTreasureOpts.show{display:flex;}
  #edFoodOpts label,#edTreasureOpts label{color:#aaa;font-size:0.7rem;}
  #edFoodOpts select,#edTreasureOpts select{background:#222;color:#eee;border:1px solid #555;padding:2px;font-size:0.7rem;}
  #edGitHub{padding:4px 6px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;border-top:1px solid #222;}
  #edGitHub input{background:#1a1a1a;color:#ccc;border:1px solid #444;padding:3px 6px;font-size:0.7rem;border-radius:3px;flex:1;min-width:80px;}
  #edGitHub button{padding:3px 10px;background:#335;color:#aaf;border:1px solid #559;border-radius:3px;font-size:0.7rem;cursor:pointer;touch-action:manipulation;}
  #editorOutput{width:100%;height:100px;background:#0a0a0a;color:#8f8;font-size:0.55rem;font-family:monospace;border:none;border-top:1px solid #222;resize:none;flex-shrink:0;padding:3px 6px;box-sizing:border-box;}
</style>
</head>
<body>
<div id="app">
  <div id="modeBar">
    <button class="mode-btn active" id="modePlay" onclick="switchMode('play')">▶ Play</button>
    <button class="mode-btn" id="modeEdit" onclick="switchMode('edit')">✏ Edit</button>
  </div>
  <div id="topbar">
    <div id="title">Piktorio</div>
    <div id="statusbar">
      <div class="stat"><span class="stat-label">T</span><span class="stat-val" id="piktorioTurn">1</span></div>
      <div class="stat"><span class="stat-label">Phase</span><span class="stat-val" id="piktorioPhase">—</span></div>
      <div class="stat"><span class="stat-label">Move</span><span class="stat-val" id="piktorioMoves">3</span></div>
    </div>
  </div>
  <div id="piktorioMessage">読み込み中…</div>
  <div id="canvasWrap"><canvas id="piktorioCanvas"></canvas></div>
  <div id="legend">
    <div class="leg"><div class="leg-box" style="background:#2d5a1b"></div>通路</div>
    <div class="leg"><div class="leg-box" style="background:#5a3010"></div>壁</div>
    <div class="leg"><div class="leg-box" style="background:#4a2808"></div>ヒビ壁(HP100)</div>
    <div class="leg"><div class="leg-box" style="background:#cc3333"></div>赤/赤ヒビ(HP40)</div>
    <div class="leg"><div class="leg-box" style="background:#2277cc"></div>青/青ヒビ(HP40)</div>
    <div class="leg"><div class="leg-box" style="background:#aaaa10"></div>黄/黄ヒビ(HP40)</div>
  </div>
  <div id="editorPanel">
    <div id="edToolBar">
      <button class="ed-tool-btn active" id="edTool_scroll" onclick="PiktorioEditor.setTool('scroll')">🖐 スクロール</button>
      <button class="ed-tool-btn" id="edTool_draw" onclick="PiktorioEditor.setTool('draw')">✏ 描画</button>
      <button class="ed-tool-btn" id="edTool_erase" onclick="PiktorioEditor.setTool('erase')">🗑 削除</button>
    </div>
    <div id="edPalette">
      <button class="ed-palette-btn active" data-type="wall" style="background:#5a3010" onclick="selPalette('wall')">壁</button>
      <button class="ed-palette-btn" data-type="walk" style="background:#2d5a1b" onclick="selPalette('walk')">通路</button>
      <button class="ed-palette-btn" data-type="cracked" style="background:#4a2808" onclick="selPalette('cracked')">ヒビ壁</button>
      <button class="ed-palette-btn" data-type="red" style="background:#cc3333" onclick="selPalette('red')">赤壁</button>
      <button class="ed-palette-btn" data-type="blue" style="background:#2277cc" onclick="selPalette('blue')">青壁</button>
      <button class="ed-palette-btn" data-type="yellow" style="background:#aaaa10" onclick="selPalette('yellow')">黄壁</button>
      <button class="ed-palette-btn" data-type="red_cracked" style="background:#cc3333;border-style:dashed" onclick="selPalette('red_cracked')">赤ヒビ</button>
      <button class="ed-palette-btn" data-type="blue_cracked" style="background:#2277cc;border-style:dashed" onclick="selPalette('blue_cracked')">青ヒビ</button>
      <button class="ed-palette-btn" data-type="yellow_cracked" style="background:#aaaa10;border-style:dashed" onclick="selPalette('yellow_cracked')">黄ヒビ</button>
      <button class="ed-palette-btn" data-type="food_" style="background:#cc3333" onclick="selPalette('food_')">エサ</button>
      <button class="ed-palette-btn" data-type="treasure_" style="background:#333;color:#ff0" onclick="selPalette('treasure_')">★宝物</button>
      <button class="ed-palette-btn" data-type="start" style="background:#fff;color:#000" onclick="selPalette('start')">S</button>
    </div>
    <div id="edFoodOpts">
      <label>色:
        <select onchange="PiktorioEditor.setFoodColor(this.value)">
          <option value="red">赤</option>
          <option value="blue">青</option>
          <option value="yellow">黄</option>
        </select>
      </label>
      <label>重さ:
        <select onchange="PiktorioEditor.setFoodWeight(this.value)">
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="10">10</option>
        </select>
      </label>
    </div>
    <div id="edTreasureOpts">
      <label>重さ:
        <select onchange="PiktorioEditor.setTreasureWeight(this.value)">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="40">40</option>
        </select>
      </label>
    </div>
    <div id="edGitHub">
      <button onclick="edTestPlay()">▶ テスト</button>
      <button onclick="edShowPushDialog()">⬆ Push</button>
    </div>
    <!-- Push ダイアログ -->
    <div id="edPushDialog" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center;">
      <div style="background:#1a1a1a;border:1px solid #555;border-radius:8px;padding:16px;width:min(90vw,340px);display:flex;flex-direction:column;gap:8px;">
        <div style="color:#ccc;font-size:0.85rem;font-weight:bold;">GitHub へ Push</div>
        <label style="color:#aaa;font-size:0.75rem;">Owner<br><input id="dlgOwner" style="width:100%;background:#111;color:#eee;border:1px solid #444;padding:5px;border-radius:4px;box-sizing:border-box;" placeholder="例: paijp"></label>
        <label style="color:#aaa;font-size:0.75rem;">Repository<br><input id="dlgRepo" style="width:100%;background:#111;color:#eee;border:1px solid #444;padding:5px;border-radius:4px;box-sizing:border-box;" placeholder="例: piktorio"></label>
        <label style="color:#aaa;font-size:0.75rem;">Personal Access Token<br><input id="dlgPat" type="password" style="width:100%;background:#111;color:#eee;border:1px solid #444;padding:5px;border-radius:4px;box-sizing:border-box;" placeholder="ghp_..."></label>
        <label style="color:#aaa;font-size:0.75rem;">Commit メッセージ<br><input id="dlgMsg" style="width:100%;background:#111;color:#eee;border:1px solid #444;padding:5px;border-radius:4px;box-sizing:border-box;" value="Update map via PiktorioEditor"></label>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px;">
          <button onclick="document.getElementById('edPushDialog').style.display='none'" style="padding:6px 16px;background:#333;color:#ccc;border:1px solid #555;border-radius:4px;cursor:pointer;">キャンセル</button>
          <button onclick="edPushConfirm()" style="padding:6px 16px;background:#335;color:#aaf;border:1px solid #559;border-radius:4px;cursor:pointer;">Push</button>
        </div>
      </div>
    </div>
    <textarea id="editorOutput" readonly placeholder="編集するとindex.htmlが表示されます…"></textarea>
  </div>
  <textarea id="debugLog" readonly placeholder="デバッグログ…"></textarea>
</div>
<script src="piktorioengine.js?v=0.16"></script>
<script src="piktorioeditor.js?v=1.1"></script>

// ===== モード管理 =====
let _currentMode = 'play';
function switchMode(mode) {
  _currentMode = mode;
  document.getElementById('modePlay').classList.toggle('active', mode==='play');
  document.getElementById('modeEdit').classList.toggle('active', mode==='edit');
  document.getElementById('topbar').style.display    = mode==='play' ? '' : 'none';
  document.getElementById('legend').style.display    = mode==='play' ? '' : 'none';
  document.getElementById('piktorioMessage').style.display = mode==='play' ? '' : 'none';
  document.getElementById('debugLog').style.display  = mode==='play' ? '' : 'none';
  document.getElementById('editorPanel').style.display = mode==='edit' ? 'flex' : 'none';
  if (mode === 'edit') {
    if (!window._originalHTML) window._originalHTML = document.getElementById('editorOutput')?.value || new XMLSerializer().serializeToString(document);
    unbindCanvas(); // プレイヤー操作を無効化
    PiktorioEditor.activate(mapData);
  } else {
    PiktorioEditor.deactivate();
    bindCanvas();
    if (window._piktorioReady) Piktorioengine.init(mapData);
  }
}

// エディタパレット選択
function selPalette(type) {
  PiktorioEditor.setTool('draw');
  document.getElementById('edTool_draw').classList.add('active');
  document.getElementById('edTool_scroll').classList.remove('active');
  document.getElementById('edTool_erase').classList.remove('active');
  PiktorioEditor.setDrawType(type);
  document.getElementById('edFoodOpts').classList.toggle('show', type==='food_');
  document.getElementById('edTreasureOpts').classList.toggle('show', type==='treasure_');
}

// テストプレイ
function edTestPlay() {
  const testData = PiktorioEditor.getMapData();
  // mapDataを一時的に上書きしてplayモードに切替
  Object.assign(mapData, testData);
  switchMode('play');
}

// URLからowner/repoを推測（GitHub Pages: https://owner.github.io/repo/）
function _guessFromURL() {
  try {
    const h = location.hostname; // e.g. paijp.github.io
    const p = location.pathname; // e.g. /piktorio/
    const owner = h.replace('.github.io','');
    const repo  = p.split('/').filter(Boolean)[0] || '';
    return { owner, repo };
  } catch(e) { return { owner:'', repo:'' }; }
}

// Pushダイアログを開く
function edShowPushDialog() {
  const dlg = document.getElementById('edPushDialog');
  // 初期値: localStorage → URL推測
  const saved_o = localStorage.getItem('piktorioEdOwner');
  const saved_r = localStorage.getItem('piktorioEdRepo');
  const saved_p = localStorage.getItem('piktorioEdPat');
  const guess   = _guessFromURL();
  document.getElementById('dlgOwner').value = saved_o || guess.owner;
  document.getElementById('dlgRepo').value  = saved_r || guess.repo;
  document.getElementById('dlgPat').value   = saved_p || '';
  dlg.style.display = 'flex';
}

// Push実行
async function edPushConfirm() {
  const owner = document.getElementById('dlgOwner').value.trim();
  const repo  = document.getElementById('dlgRepo').value.trim();
  const pat   = document.getElementById('dlgPat').value.trim();
  const msg   = document.getElementById('dlgMsg').value.trim() || 'Update map via PiktorioEditor';
  if (!owner || !repo || !pat) { alert('owner / repo / PATを入力してください'); return; }
  localStorage.setItem('piktorioEdOwner', owner);
  localStorage.setItem('piktorioEdRepo',  repo);
  localStorage.setItem('piktorioEdPat',   pat);
  document.getElementById('edPushDialog').style.display = 'none';
  await PiktorioEditor.pushToGitHub(owner, repo, pat, msg);
}

function resizeCanvas(){
  const canvas=document.getElementById('piktorioCanvas');
  const wrap=document.getElementById('canvasWrap');
  const raw=Math.min(wrap.clientWidth||window.innerWidth, wrap.clientHeight||window.innerHeight);
  const size=Math.max(280, Math.floor(raw/40)*40);
  canvas.width=size;canvas.height=size;
  if(window._piktorioReady)Piktorioengine.init(mapData);
}
function bindCanvas(){
  const canvas=document.getElementById('piktorioCanvas');
  if(window._playTouchStart) canvas.removeEventListener('touchstart', window._playTouchStart);
  if(window._playTouchEnd)   canvas.removeEventListener('touchend',   window._playTouchEnd);
  if(window._playClick)      canvas.removeEventListener('click',      window._playClick);
  window._playTouchStart = e=>{ e.preventDefault(); };
  window._playTouchEnd   = e=>{ e.preventDefault(); Piktorioengine.handleCanvasClick(e.changedTouches[0]); };
  window._playClick      = e=>Piktorioengine.handleCanvasClick(e);
  canvas.addEventListener('touchstart', window._playTouchStart, {passive:false});
  canvas.addEventListener('touchend',   window._playTouchEnd,   {passive:false});
  canvas.addEventListener('click',      window._playClick);
}
function unbindCanvas(){
  const canvas=document.getElementById('piktorioCanvas');
  if(window._playTouchStart) canvas.removeEventListener('touchstart', window._playTouchStart);
  if(window._playTouchEnd)   canvas.removeEventListener('touchend',   window._playTouchEnd);
  if(window._playClick)      canvas.removeEventListener('click',      window._playClick);
}
window.onerror=function(msg,src,line,col,err){
  const el=document.getElementById('debugLog');
  if(el) el.value='ERROR: '+msg+' ('+src+':'+line+':'+col+')\n'+(err?err.stack:'');
  document.getElementById('piktorioMessage').textContent='エラー: '+msg;
  return true;
};
window.addEventListener('DOMContentLoaded',()=>{
  bindCanvas();
  const log=document.getElementById('debugLog');
  const msg=document.getElementById('piktorioMessage');

  function dbg(s){ if(log) log.value=s+'\n'+log.value; }

  dbg('DOMContentLoaded fired');

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const canvas=document.getElementById('piktorioCanvas');
      const wrap=document.getElementById('canvasWrap');
      const wW=wrap.clientWidth, wH=wrap.clientHeight;
      const iW=window.innerWidth, iH=window.innerHeight;
      dbg('wrap='+wW+'x'+wH+' inner='+iW+'x'+iH);

      // canvasサイズを設定
      const size=Math.max(280, Math.floor(Math.min(wW||iW, wH||iH)/40)*40);
      canvas.width=size; canvas.height=size;
      dbg('canvas='+canvas.width+'x'+canvas.height);

      // ステップ1: 直接描画テスト
      try{
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#1a3a10';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#ffffff';
        ctx.font='bold 24px monospace';
        ctx.textAlign='center';
        ctx.fillText('canvas OK '+size, canvas.width/2, canvas.height/2);
        dbg('direct draw OK');
      }catch(e){ dbg('draw ERR: '+e.message); }

      // ステップ2: エンジン初期化
      try{
        window._piktorioReady=true;
        Piktorioengine.init(mapData);
        dbg('engine init OK');
      }catch(e){
        dbg('INIT ERR: '+e.message);
        if(msg) msg.textContent='エラー: '+e.message;
      }
    });
  });
});
let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(resizeCanvas,150);});
</script>
