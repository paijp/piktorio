<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piktorio</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0e0e0e;--green:#3a7a25;--greenlt:#b8e888;--muted:#666}
  html,body{background:var(--bg);color:#d8d4c0;font-family:'Courier New',monospace;height:100%;overflow:hidden;touch-action:none}
  #app{display:flex;flex-direction:column;align-items:center;height:100dvh;gap:4px;padding:6px 4px 4px}
  #topbar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:560px;flex-shrink:0;gap:8px}
  #title{font-size:clamp(0.8rem,2.8vw,1.1rem);letter-spacing:0.2em;color:var(--greenlt);text-transform:uppercase}
  #statusbar{display:flex;gap:10px;font-size:clamp(0.6rem,2vw,0.75rem)}
  .stat{display:flex;gap:3px}.stat-label{color:var(--muted)}.stat-val{font-weight:bold;min-width:2ch}
  #piktorioMessage{font-size:clamp(0.56rem,1.8vw,0.7rem);color:#aad888;min-height:1.1em;text-align:center;flex-shrink:0;padding:0 6px}
  #canvasWrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
  #piktorioCanvas{border:1px solid #1a2a10;cursor:pointer;image-rendering:pixelated;touch-action:none}
  #legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:clamp(0.5rem,1.5vw,0.62rem);color:#555;justify-content:center;flex-shrink:0;padding:0 4px 2px}
  .leg{display:flex;align-items:center;gap:3px}.leg-box{width:8px;height:8px;flex-shrink:0}
  #debugLog{width:100%;max-width:560px;height:80px;background:#111;color:#8f8;font-size:0.6rem;font-family:monospace;border:1px solid #333;resize:none;flex-shrink:0;padding:2px 4px;box-sizing:border-box;}
</style>
</head>

<div id="app">
  <div id="topbar">
    <div id="title">Piktorio</div>
    <div id="statusbar">
      <div class="stat"><span class="stat-label">T</span><span class="stat-val" id="piktorioTurn">1</span></div>
      <div class="stat"><span class="stat-label">Phase</span><span class="stat-val" id="piktorioPhase">—</span></div>
      <div class="stat"><span class="stat-label">Move</span><span class="stat-val" id="piktorioMoves">3</span></div>
    </div>
  </div>
  <div id="piktorioMessage">読み込み中…</div>
  <div id="canvasWrap"><canvas id="piktorioCanvas"></canvas></div>
  <div id="legend">
    <div class="leg"><div class="leg-box" style="background:#2d5a1b"></div>通路</div>
    <div class="leg"><div class="leg-box" style="background:#5a3010"></div>壁</div>
    <div class="leg"><div class="leg-box" style="background:#4a2808"></div>ヒビ壁(HP100)</div>
    <div class="leg"><div class="leg-box" style="background:#cc3333"></div>赤/赤ヒビ(HP40)</div>
    <div class="leg"><div class="leg-box" style="background:#2277cc"></div>青/青ヒビ(HP40)</div>
    <div class="leg"><div class="leg-box" style="background:#aaaa10"></div>黄/黄ヒビ(HP40)</div>
  </div>
  <textarea id="debugLog" readonly placeholder="デバッグログ…"></textarea>
</div>
<script src="piktorioengine.js?v=0.15.2"></script>

function resizeCanvas(){
  const canvas=document.getElementById('piktorioCanvas');
  const wrap=document.getElementById('canvasWrap');
  const raw=Math.min(wrap.clientWidth||window.innerWidth, wrap.clientHeight||window.innerHeight);
  const size=Math.max(280, Math.floor(raw/40)*40);
  canvas.width=size;canvas.height=size;
  if(window._piktorioReady)Piktorioengine.init(mapData);
}
function bindCanvas(){
  const canvas=document.getElementById('piktorioCanvas');
  canvas.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});
  canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    Piktorioengine.handleCanvasClick(e.changedTouches[0]);
  },{passive:false});
  canvas.addEventListener('click',e=>Piktorioengine.handleCanvasClick(e));
}
window.onerror=function(msg,src,line,col,err){
  const el=document.getElementById('debugLog');
  if(el) el.value='ERROR: '+msg+' ('+src+':'+line+':'+col+')\n'+(err?err.stack:'');
  document.getElementById('piktorioMessage').textContent='エラー: '+msg;
  return true;
};
window.addEventListener('DOMContentLoaded',()=>{
  bindCanvas();
  const log=document.getElementById('debugLog');
  const msg=document.getElementById('piktorioMessage');

  function dbg(s){ if(log) log.value=s+'\n'+log.value; }

  dbg('DOMContentLoaded fired');

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const canvas=document.getElementById('piktorioCanvas');
      const wrap=document.getElementById('canvasWrap');
      const wW=wrap.clientWidth, wH=wrap.clientHeight;
      const iW=window.innerWidth, iH=window.innerHeight;
      dbg('wrap='+wW+'x'+wH+' inner='+iW+'x'+iH);

      // canvasサイズを設定
      const size=Math.max(280, Math.floor(Math.min(wW||iW, wH||iH)/40)*40);
      canvas.width=size; canvas.height=size;
      dbg('canvas='+canvas.width+'x'+canvas.height);

      // ステップ1: 直接描画テスト
      try{
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#1a3a10';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#ffffff';
        ctx.font='bold 24px monospace';
        ctx.textAlign='center';
        ctx.fillText('canvas OK '+size, canvas.width/2, canvas.height/2);
        dbg('direct draw OK');
      }catch(e){ dbg('draw ERR: '+e.message); }

      // ステップ2: エンジン初期化
      try{
        window._piktorioReady=true;
        Piktorioengine.init(mapData);
        dbg('engine init OK');
      }catch(e){
        dbg('INIT ERR: '+e.message);
        if(msg) msg.textContent='エラー: '+e.message;
      }
    });
  });
});
let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(resizeCanvas,150);});
